# The estimate pages (estimate.sustenaut.eu): marimo notebooks exported to
# WebAssembly, each in /<model>/, with Pyodide, its wheels, MathJax and the
# lucide icons in /vendor/. Static files only; the models run in the browser.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    server_tokens off;
    # Redirects (a directory without its slash) stay relative to the host the
    # reader used, not the container's port.
    absolute_redirect off;
    include /etc/nginx/estimate-headers.conf;

    # A first visit loads about 30 MB (Pyodide, the wheels, marimo's
    # scripts); compressed, much less.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/javascript application/javascript application/json application/wasm text/css image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pyodide's loader is an ES module; browsers refuse it unless served as JavaScript.
    location ~ \.mjs$ {
        include /etc/nginx/estimate-headers.conf;
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Pinned by version in the path, so never changed in place.
    location /vendor/ {
        include /etc/nginx/estimate-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
