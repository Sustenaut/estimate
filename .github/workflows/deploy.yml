# Build the estimate site and deploy it to Cloudflare Pages, with the team sign-in in front as its
# _worker.js, on each merge to main. The objects are the release publication.json pins, read from
# storage.sustenaut.eu's private publications tenant with this job's OpenID Connect token.
# Cloudflare's token is the secret CLOUDFLARE_GITHUB_API_TOKEN (Pages: Edit), as for maps, and the account
# the variable CLOUDFLARE_ACCOUNT_ID; the deploy step stays off until the variable is set. The Pages project
# is the estimate site in Sustenaut/shared-infra's pubkit.json.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: estimate-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the publication
        run: ./fetch-publication.sh

      # pub is built from publet; Pyodide and the wheels are fetched and
      # checked against vendor-lock.json inside the build.
      - name: Build the pages
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Take the pages out of the image
        run: |
          id=$(docker create "${IMAGE}:${GITHUB_SHA}" none)
          docker cp "${id}:/site" site
          docker rm "$id"
          count=$(find site -type f | wc -l)
          largest=$(find site -type f -printf '%s\n' | sort -n | tail -1)
          echo "$count files, largest $largest bytes"
          # What Cloudflare's free plan takes: 20,000 files, of 25 MiB at most.
          test "$count" -le 20000
          test "$largest" -le 26214400

      # Ask for the index, a model page, Pyodide and a model's inputs, so a site that
      # builds wrong fails here instead of online. This is the files with their headers,
      # before the gate joins them, so it needs no sign-in; the sign-in is Sustenaut/auth's to prove.
      - name: Check the pages
        run: |
          npm ci --ignore-scripts
          npx --no-install esbuild worker/preview.js --bundle --format=esm --outfile=site/_worker.js
          npx --no-install wrangler pages dev site --ip 127.0.0.1 --port 8080 --show-interactive-dev-session=false >/tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 60); do curl -fs -o /dev/null localhost:8080/ && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q 'Sustenaut estimates'
          curl -fs localhost:8080/example/app | grep -q 'data-pyodide-index-url="../vendor/pyodide/'
          curl -fsI localhost:8080/vendor/pyodide/v314.0.0/pyodide.asm.wasm | grep -qi 'content-type: application/wasm'
          curl -fsI localhost:8080/vendor/pyodide/v314.0.0/pyodide.asm.mjs | grep -qi 'content-type: text/javascript'
          curl -fs localhost:8080/example/public/build.json | grep -q "${GITHUB_SHA}"
          curl -fs localhost:8080/example/public/bundle/index.json | grep -q '"bundle"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/nothing-here)" = 404

      # Open each page in headless Chromium: it must load nothing from any
      # other origin and compute what the models compute natively.
      - name: Check the pages in a browser
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet "$(grep -E '^numpy==' requirements.lock)" playwright==1.64.0
          .venv/bin/playwright install --with-deps --only-shell chromium
          .venv/bin/python browser_check.py --url http://localhost:8080
          kill "$(cat /tmp/wrangler.pid)"

      - name: Put the gate in front
        run: |
          npx --no-install esbuild worker/index.js --bundle --format=esm --outfile=site/_worker.js

      # With the locked wrangler, not pubkit's deploy-static: that brings a public-site check on
      # each pull request, for pages link previews can read, and these sit behind a sign-in.
      - name: Deploy
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GITHUB_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy site --project-name sustenaut-estimate --branch main --commit-hash "$GITHUB_SHA"
