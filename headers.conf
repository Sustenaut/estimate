# Response headers for every file of the estimate site (nginx.conf includes
# this in each location, since a location's add_header replaces the server's).
# Everything a page loads is on this origin, and the Content-Security-Policy
# holds the browser to that: connect-src 'self' stops any fetch elsewhere, in
# the page and in marimo's worker. Pyodide compiles WebAssembly and marimo runs
# inline scripts and styles and blob: workers, hence those exceptions.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob: data:; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
